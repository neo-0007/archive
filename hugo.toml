baseURL = "https://hrishikeshgohain.netlify.app/"

title = "Hrishikesh Gohain"
theme = "typo"

languageCode = "en-us"
defaultContentLanguage = "en"

# Must stay at the top, above any [table] header
enableGitInfo = true
timeZone = "Asia/Kolkata"

# ---------- Modules (CMS) ----------
[module]
  [[module.imports]]
    path = "github.com/privatemaker/headless-cms"

# ---------- Outputs ----------
[outputs]
home = ["HTML", "RSS", "HeadlessCMSConfig"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]

# ---------- Taxonomies ----------
[taxonomies]
category = "categories"
tag = "tags"

# ---------- Markup ----------
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "catppuccin-macchiato"

# ---------- Front matter ----------
[frontmatter]
date = ["date", ":filename", ":default"]
lastmod = [":git", "lastmod", "modified", ":fileModTime", ":default"]

# ---------- Theme params ----------
[params]
description = "Portfolio and blog to post projects and ideas, by Hrishikesh Gohain."
ShowFullTextinRSS = true

appearance = "auto"
colorPalette = "base16-eighties"
hideHeader = false

paginationSize = 10
listSummaries = true

footerContent = "Built with Hugo | Hosted on Netlify "

[[params.menu]]
name = "home"
url  = "/"

[[params.menu]]
name = "posts"
url  = "/posts"

[[params.menu]]
name = "experiments"
url  = "/experiments"

[[params.menu]]
name = "howto"
url  = "/howto"

[[params.menu]]
name = "interpretations"
url  = "/interpretations"

[[params.social]]
name = "github"
url = "https://github.com/neo-0007"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/hrishiii/"

[[params.social]]
name = "discord"
url = "https://discord.com/users/userid/hrishikeshgohain."

[params.zoomment]
enable = true

# ---------- Headless CMS (Sveltia) ----------
[params.headless_cms]
engine = "sveltia"
site_url = "https://hrishikeshgohain.netlify.app"

[params.headless_cms.backend]
name = "github"
repo = "neo-0007/archive"
branch = "port/hugo"

# =====================================================
# POSTS
# =====================================================
[params.headless_cms.collections.posts]
name = "posts"
label = "Posts"
folder = "content/posts"
create = true
extension = "md"
media_folder = ""
public_folder = ""

[params.headless_cms.collections.posts.nested]
depth = 3
summary = "{{title}}"

[params.headless_cms.collections.posts.meta.path]
label = "Path"
widget = "string"
index_file = "index"

  [[params.headless_cms.collections.posts.fields]]
  label = "Title"
  name = "title"
  widget = "string"

  [[params.headless_cms.collections.posts.fields]]
  label = "Summary"
  name = "summary"
  widget = "string"
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Date"
  name = "date"
  widget = "datetime"
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Tags"
  name = "tags"
  widget = "list"
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Categories"
  name = "categories"
  widget = "list"
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Table of contents"
  name = "toc"
  widget = "boolean"
  default = false
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Show read time"
  name = "readTime"
  widget = "boolean"
  default = false
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Auto-number headings"
  name = "autonumber"
  widget = "boolean"
  default = false
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Math"
  name = "math"
  widget = "boolean"
  default = false
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Show tags"
  name = "showTags"
  widget = "boolean"
  default = false
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Draft"
  name = "draft"
  widget = "boolean"
  default = false
  required = false

  [[params.headless_cms.collections.posts.fields]]
  label = "Body"
  name = "body"
  widget = "markdown"

